name: auto-build
on:
  workflow_dispatch:
  push:
    branches:
      - "v4"
    tags:
      - "v*"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build
        run: |
          npm install
          npm run build
          zip -r ./lite_tools_v4.zip ./dist ./src ./icon.png ./LICENSE ./manifest.json ./package.json ./README.md
      - name: Upload Release File
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: lite_tools_v4.zip
          body_path: ./release.md
